<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>UltraSon Talk - Public</title>
    
    <!-- Config iPhone PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <style>
        :root { --primary: #5856D6; --bg: #f2f2f7; }
        body { 
            font-family: -apple-system, sans-serif; 
            background: var(--bg); margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        .card { 
            background: white; border-radius: 20px; padding: 20px; width: 100%; max-width: 350px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px;
        }
        h2 { margin: 0 0 15px 0; font-size: 18px; color: #1c1c1e; }
        input { 
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; 
            margin-bottom: 10px; font-size: 16px; box-sizing: border-box;
        }
        button { 
            width: 100%; background: var(--primary); color: white; border: none; 
            padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer;
        }
        #log { 
            width: 100%; height: 100px; background: #000; color: #00ff00;
            border-radius: 10px; padding: 10px; font-family: monospace;
            overflow-y: auto; box-sizing: border-box; margin-top: 10px;
        }
        .status { font-size: 12px; color: #8e8e93; margin-top: 5px; text-align: center; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🚀 Émetteur (Ultrasons)</h2>
        <input type="text" id="message" placeholder="Message secret...">
        <button onclick="sendData()">🎵 ENVOYER</button>
        <p class="status">Fréquences : 18.5kHz / 19kHz</p>
    </div>

    <div class="card">
        <h2>👂 Récepteur</h2>
        <button style="background:#34C759" onclick="startListening()">🎤 ACTIVER L'ÉCOUTE</button>
        <div id="log"></div>
        <div id="status" class="status">Statut : En attente</div>
        <button style="background:#ff3b30; margin-top:10px; padding:5px;" onclick="document.getElementById('log').innerText=''">Effacer</button>
    </div>

    <script>
        // --- CONFIGURATION ---
        const FREQ_ZERO = 18500; 
        const FREQ_ONE = 19000;  
        const BIT_DURATION = 0.3; // 300ms (stable)
        const HEADER = "1110";    // Signal d'alerte

        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function sendData() {
            initAudio();
            const text = document.getElementById('message').value;
            if(!text) return;

            let binary = HEADER; 
            for (let i = 0; i < text.length; i++) {
                binary += text[i].charCodeAt(0).toString(2).padStart(8, '0');
            }

            let now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine'; // Sinusoïdale est plus pure pour les ultrasons
            gain.gain.setValueAtTime(0.5, now);
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            for (let i = 0; i < binary.length; i++) {
                const freq = binary[i] === '1' ? FREQ_ONE : FREQ_ZERO;
                osc.frequency.setValueAtTime(freq, now + (i * BIT_DURATION));
            }

            osc.start(now);
            osc.stop(now + (binary.length * BIT_DURATION));
        }

        function startListening() {
            initAudio();
            document.getElementById('status').innerText = "Statut : ÉCOUTE ACTIVE...";

            navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                const source = audioCtx.createMediaStreamSource(stream);
                const analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048; // Précision accrue pour les hautes fréquences
                source.connect(analyser);

                const dataArray = new Uint8Array(analyser.frequencyBinCount);
                const binHz = audioCtx.sampleRate / analyser.fftSize;
                const i0 = Math.round(FREQ_ZERO / binHz);
                const i1 = Math.round(FREQ_ONE / binHz);

                let isReading = false;

                const check = setInterval(() => {
                    analyser.getByteFrequencyData(dataArray);
                    // Détection du début (si la fréquence ONE dépasse un seuil)
                    if (!isReading && dataArray[i1] > 40) {
                        isReading = true;
                        document.getElementById('status').innerText = "Statut : RÉCEPTION...";
                        // On attend la fin du header pour lire les données
                        setTimeout(() => { record(analyser, i0, i1); }, BIT_DURATION * 3500);
                    }
                }, 50);
            });
        }

        function record(an, i0, i1) {
            let bits = "";
            const dataArray = new Uint8Array(an.frequencyBinCount);
            
            const interval = setInterval(() => {
                let v0 = 0, v1 = 0;
                // Vote par majorité sur 5 mesures
                for(let i=0; i<5; i++) {
                    an.getByteFrequencyData(dataArray);
                    v0 += dataArray[i0];
                    v1 += dataArray[i1];
                }
                
                bits += (v1 > v0) ? "1" : "0";
                
                if (bits.length === 8) {
                    let charCode = parseInt(bits, 2);
                    if (charCode >= 32 && charCode <= 126) {
                        document.getElementById('log').innerText += String.fromCharCode(charCode);
                    }
                    bits = "";
                }
            }, BIT_DURATION * 1000);

            // Stop après 15 secondes ou réinitialisation
            setTimeout(() => { 
                clearInterval(interval); 
                document.getElementById('status').innerText = "Statut : Terminé";
                setTimeout(() => location.reload(), 2000);
            }, 15000);
        }
    </script>
</body>
</html>
