<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>UltraTalk v4 - Silence Total</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <style>
        body { 
            font-family: -apple-system, sans-serif; background: #1c1c1e; padding: 20px; color: white;
            display: flex; flex-direction: column; align-items: center; 
        }
        .card { 
            background: #2c2c2e; border-radius: 15px; padding: 20px; 
            width: 100%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        input { 
            width: 100%; padding: 12px; margin: 10px 0; border: none; 
            border-radius: 8px; box-sizing: border-box; font-size: 16px; background: #3a3a3c; color: white;
        }
        button { 
            width: 100%; padding: 15px; border: none; border-radius: 8px; 
            color: white; font-weight: bold; cursor: pointer; font-size: 16px;
        }
        /* Style fidèle à ton image image_92941f.png */
        #log { 
            width: 100%; min-height: 200px; background: #000; color: #34c759;
            border-radius: 12px; padding: 15px; font-family: 'Courier New', monospace;
            font-size: 22px; margin-top: 10px; box-sizing: border-box;
            word-wrap: break-word; white-space: pre-wrap; border: 1px solid #34c759;
        }
        .status { font-size: 14px; color: #8e8e93; text-align: center; margin: 10px 0; }
    </style>
</head>
<body>

    <div class="card">
        <h2 style="margin-top:0">📤 Émetteur Fantôme</h2>
        <input type="text" id="message" placeholder="Message secret...">
        <button style="background: #5856D6;" onclick="sendData()">🎵 ENVOYER (24kHz)</button>
    </div>

    <div class="card">
        <h2 style="margin-top:0">📥 Récepteur</h2>
        <button style="background: #30d158;" onclick="startListening()">🎤 ACTIVER L'ÉCOUTE</button>
        <div class="status" id="status">Statut : Inactif</div>
        <div id="log">--- Prêt ---</div>
        <button style="background: #ff453a; margin-top:10px; padding:12px; border-radius:10px;" onclick="document.getElementById('log').innerText=''">Effacer</button>
    </div>

    <script>
        // FRÉQUENCES FANTÔMES
        const FREQ_ZERO = 23000; 
        const FREQ_ONE = 24000;  
        const BIT_DURATION = 0.5; // Plus lent pour compenser la perte de puissance à 24kHz

        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function sendData() {
            initAudio();
            const text = document.getElementById('message').value;
            if(!text) return;

            let binary = "1110"; 
            for (let i = 0; i < text.length; i++) {
                binary += text[i].charCodeAt(0).toString(2).padStart(8, '0');
            }

            let now = audioCtx.currentTime;
            
            // Pour chaque bit, on crée un oscillateur avec rampe pour éviter le "clic"
            binary.split('').forEach((bit, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const freq = bit === '1' ? FREQ_ONE : FREQ_ZERO;
                const start = now + (i * BIT_DURATION);
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, start);
                
                // Rampe de volume (Fade in / Fade out) pour le silence
                gain.gain.setValueAtTime(0, start);
                gain.gain.linearRampToValueAtTime(0.4, start + 0.05);
                gain.gain.setValueAtTime(0.4, start + BIT_DURATION - 0.05);
                gain.gain.linearRampToValueAtTime(0, start + BIT_DURATION);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(start);
                osc.stop(start + BIT_DURATION);
            });
        }

        function startListening() {
            initAudio();
            document.getElementById('status').innerText = "👂 Écoute (Frequences Max)";
            if(document.getElementById('log').innerText.includes("---")) document.getElementById('log').innerText = "";

            navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                const source = audioCtx.createMediaStreamSource(stream);
                const analyser = audioCtx.createAnalyser();
                analyser.fftSize = 4096;
                source.connect(analyser);

                const dataArray = new Uint8Array(analyser.frequencyBinCount);
                const binHz = audioCtx.sampleRate / analyser.fftSize;
                const i0 = Math.round(FREQ_ZERO / binHz);
                const i1 = Math.round(FREQ_ONE / binHz);

                let isReading = false;
                setInterval(() => {
                    analyser.getByteFrequencyData(dataArray);
                    // On baisse le seuil car le 24kHz est capté plus faiblement
                    if (!isReading && (dataArray[i1] > 15 || dataArray[i0] > 15)) {
                        isReading = true;
                        document.getElementById('status').innerText = "📡 Réception...";
                        setTimeout(() => record(analyser, i0, i1), BIT_DURATION * 3000);
                    }
                }, 50);
            });
        }

        function record(an, i0, i1) {
            let bits = "";
            const dataArray = new Uint8Array(an.frequencyBinCount);
            const interval = setInterval(() => {
                let v0 = 0, v1 = 0;
                for(let i=0; i<10; i++) {
                    an.getByteFrequencyData(dataArray);
                    v0 += dataArray[i0]; v1 += dataArray[i1];
                }
                bits += (v1 > v0) ? "1" : "0";
                
                if (bits.length === 8) {
                    let code = parseInt(bits, 2);
                    if (code >= 32 && code <= 126) {
                        document.getElementById('log').innerText += String.fromCharCode(code);
                    }
                    bits = "";
                }
            }, BIT_DURATION * 1000);
            
            setTimeout(() => { 
                clearInterval(interval); 
                document.getElementById('status').innerText = "✅ Session finie";
                setTimeout(() => location.reload(), 5000);
            }, 25000);
        }
    </script>
</body>
</html>
